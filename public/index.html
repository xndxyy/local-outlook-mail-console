<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地 Outlook 取件台</title>
    <link rel="icon" type="image/png" sizes="256x256" href="/local-outlook-mail-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m4 8 8 5 8-5"></path>
            </svg>
          </div>
          <div>
            <h1>本地 Outlook 取件台</h1>
            <p>IMAP OAuth2 / Graph API</p>
          </div>
        </div>
        <div class="status-strip">
          <span class="status-chip status-safe" id="localMode">127.0.0.1</span>
          <span class="status-chip" id="accountMode">本机加密</span>
          <span class="status-chip" id="statusBadge">就绪</span>
        </div>
      </header>

      <div class="layout">
        <aside class="panel sidebar">
          <div class="section-head">
            <h2>邮箱列表</h2>
            <span class="counter" id="accountCount">0</span>
          </div>

          <div class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m16.5 16.5 4 4"></path>
            </svg>
            <input id="accountSearch" type="search" placeholder="搜索邮箱" autocomplete="off" />
          </div>

          <div class="button-stack">
            <button class="button primary full" id="btnMicrosoftLogin" type="button">
              <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg>
              Microsoft 登录
            </button>
            <button class="button secondary" id="btnOpenImport" type="button">
              <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
              批量导入
            </button>
            <button class="button secondary" id="btnExportAccounts" type="button">
              <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
              导出清单
            </button>
          </div>

          <div class="account-list" id="accountList"></div>

          <footer class="side-footer">
            <button class="button quiet danger" id="btnClearAll" type="button">
              <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg>
              清空全部
            </button>
          </footer>
        </aside>

        <main class="main">
          <section class="panel controls">
            <div class="control-grid">
              <label class="field wide">
                <span>关键词</span>
                <input id="searchKeyword" type="search" placeholder="主题 / 正文" />
              </label>
              <label class="field">
                <span>发件人</span>
                <input id="searchSender" type="search" placeholder="可选" />
              </label>
              <label class="field compact">
                <span>数量</span>
                <select id="fetchLimit">
                  <option value="5">5</option>
                  <option value="10" selected>10</option>
                  <option value="20">20</option>
                  <option value="30">30</option>
                </select>
              </label>
            </div>
            <div class="action-row">
              <div class="segmented" role="group" aria-label="协议">
                <label><input id="toggleGraph" type="checkbox" /> <span>Graph</span></label>
                <label><input id="toggleImap" type="checkbox" checked /> <span>IMAP</span></label>
              </div>
              <div class="action-buttons">
                <button class="button secondary" id="btnFetchSelected" type="button">
                  <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
                  选中取件
                </button>
                <button class="button accent" id="btnFetchAll" type="button">
                  <svg viewBox="0 0 24 24"><path d="M4 12h16M12 4l8 8-8 8"></path></svg>
                  全部取件
                </button>
              </div>
            </div>
          </section>

          <section class="progress panel" id="progressPanel" hidden>
            <div class="progress-meta">
              <span id="progressText">准备中</span>
              <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track"><div id="progressFill"></div></div>
          </section>

          <section class="results">
            <div class="results-head" id="resultsHead" hidden>
              <h2>取件结果</h2>
              <div class="result-counters">
                <span class="counter graph" id="graphCount">Graph 0</span>
                <span class="counter imap" id="imapCount">IMAP 0</span>
                <span class="counter" id="totalCount">共 0</span>
              </div>
            </div>
            <div class="issues" id="issues" hidden></div>
            <div class="email-list" id="emailList"></div>
          </section>
        </main>
      </div>
    </div>

    <div class="modal-backdrop" id="deviceAuthModal" hidden>
      <section class="modal auth-modal" role="dialog" aria-modal="true" aria-labelledby="deviceAuthTitle">
        <header class="modal-head">
          <h2 id="deviceAuthTitle">Microsoft 设备授权</h2>
          <button class="icon-button" id="btnCloseDeviceAuth" type="button" aria-label="关闭">×</button>
        </header>
        <div class="modal-body auth-body">
          <div id="authSetup">
            <label class="field">
              <span>账号提示（可选）</span>
              <input id="authEmailHint" type="email" placeholder="user@outlook.com" autocomplete="email" />
            </label>
            <label class="field auth-protocol-field">
              <span>本次授权协议</span>
              <select id="authProtocol">
                <option value="imap" selected>IMAP 邮件读取</option>
                <option value="graph">Graph 邮件读取</option>
              </select>
            </label>
            <p class="auth-note">Microsoft 对不同邮件资源分别授权。需要两种协议时，请各登录一次。</p>
          </div>
          <div class="auth-challenge" id="authChallenge" hidden>
            <span>在 Microsoft 页面输入此代码</span>
            <button class="device-code" id="btnCopyDeviceCode" type="button" title="复制设备码">
              <strong id="deviceUserCode">—</strong>
            </button>
            <p id="authStatusText">等待完成授权…</p>
          </div>
        </div>
        <footer class="modal-actions">
          <button class="button secondary" id="btnCancelDeviceAuth" type="button">取消</button>
          <button class="button primary" id="btnStartDeviceAuth" type="button">开始授权</button>
          <button class="button primary" id="btnOpenMicrosoftLink" type="button" hidden>打开 Microsoft</button>
        </footer>
      </section>
    </div>

    <div class="modal-backdrop" id="importModal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="importTitle">
        <header class="modal-head">
          <h2 id="importTitle">批量导入邮箱</h2>
          <button class="icon-button" id="btnCloseImport" type="button" aria-label="关闭">×</button>
        </header>
        <div class="modal-body">
          <div class="format-row">
            <code>账号----密码----clientid----刷新令牌</code>
            <span>密码字段会被丢弃</span>
          </div>
          <textarea id="importTextarea" spellcheck="false" rows="11" placeholder="user@outlook.com----password----client-id----refresh-token"></textarea>
          <div class="preview" id="importPreview"></div>
        </div>
        <footer class="modal-actions">
          <button class="button secondary" id="btnCancelImport" type="button">取消</button>
          <button class="button primary" id="btnConfirmImport" type="button">确认导入</button>
        </footer>
      </section>
    </div>

    <div class="modal-backdrop" id="detailModal" hidden>
      <section class="modal detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <header class="modal-head">
          <h2 id="detailTitle">邮件详情</h2>
          <button class="icon-button" id="btnCloseDetail" type="button" aria-label="关闭">×</button>
        </header>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-body" id="detailBody"></div>
      </section>
    </div>

    <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  </body>
</html>
